name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests tools
      - name: Tests (synthetic flows, no dataset needed)
        run: pytest -q

  release-model:
    # The committed model must be signed by the release key, unmodified, safe-format only,
    # clean for ModelScan, and must pass the accuracy + robustness gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Verify signature, hashes, formats, scan and gate
        run: python -m advml.verify models/release --gate
